<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰凌の小栈 | API 详情</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <!-- Markdown 渲染 + 代码高亮 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <link rel="stylesheet" href="/lib/all.css">
    <style>
        .back-bar {
            margin: 30px 0 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(230, 200, 210, 0.5);
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .back-btn:hover {
            color: var(--sakura-deep);
            background: var(--white-card-hover);
            transform: translateX(-3px);
            box-shadow: var(--shadow-card);
        }

        /* 头部卡片 */
        .api-header-card {
            background: var(--white-card);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(240, 215, 225, 0.5);
            border-radius: var(--radius-lg);
            padding: 30px 32px;
            box-shadow: var(--shadow-card);
            margin-bottom: 24px;
        }

        .api-title-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .api-title-row .api-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .api-title-row h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.7rem;
            color: var(--text-primary);
            margin: 0;
        }

        .api-sub {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 16px;
        }

        .endpoint-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 248, 250, 0.85);
            border: 1px dashed rgba(220, 190, 200, 0.7);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .endpoint-box code {
            font-family: 'Quicksand', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            word-break: break-all;
            flex: 1;
        }

        /* 合并进标题卡片的接口说明 */
        .intro-merged {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed rgba(220, 190, 200, 0.6);
        }

        .intro-merged .intro-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            margin-bottom: 8px;
        }

        .intro-merged .intro-label i {
            color: var(--sakura-deep);
        }

        /* ===== 在线请求 ===== */
        .req-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 248, 250, 0.85);
            border: 1px dashed rgba(220, 190, 200, 0.7);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .req-bar code {
            font-family: 'Quicksand', monospace;
            font-size: 0.82rem;
            color: var(--text-primary);
            word-break: break-all;
            flex: 1;
        }

        .req-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .req-select {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-light);
            background: var(--white-card);
            border: 1px solid rgba(230, 200, 210, 0.5);
            border-radius: 50px;
            padding: 5px 14px;
        }

        .req-select select {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            outline: none;
            cursor: pointer;
        }

        .mini-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--white-card);
            border: 1px solid rgba(230, 200, 210, 0.5);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
        }

        .mini-btn:hover {
            background: rgba(250, 218, 221, 0.4);
            color: var(--sakura-deep);
            border-color: var(--sakura-mid);
        }

        .mini-btn.ghost {
            border-style: dashed;
            color: var(--text-light);
        }

        /* 参数编辑器 */
        .param-editor {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .param-row {
            display: grid;
            grid-template-columns: 28px 1fr 1.4fr 36px;
            gap: 8px;
            align-items: center;
        }

        .param-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--sakura-deep);
            cursor: pointer;
            justify-self: center;
        }

        .param-row input[type="text"] {
            width: 100%;
            border: 1px solid rgba(230, 200, 210, 0.6);
            background: rgba(255, 253, 254, 0.9);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-family: 'Quicksand', 'Noto Sans SC', monospace;
            font-size: 0.82rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .param-row input[type="text"]:focus {
            border-color: var(--sakura-mid);
            box-shadow: 0 0 0 3px rgba(244, 184, 193, 0.22);
        }

        .param-row input[type="text"]::placeholder {
            color: var(--text-light);
        }

        .param-row.disabled input[type="text"] {
            opacity: 0.45;
        }

        .row-del {
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            justify-self: center;
        }

        .row-del:hover {
            color: #C97A7A;
            background: rgba(201, 122, 122, 0.12);
        }

        .param-empty {
            font-size: 0.82rem;
            color: var(--text-light);
            padding: 6px 2px;
        }

        .req-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .send-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--sakura-deep);
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 18px rgba(232, 141, 155, 0.32);
        }

        .send-btn:hover {
            background: #DE7C8C;
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(232, 141, 155, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .req-hint {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* 响应区域 */
        .resp-area {
            margin-top: 18px;
        }

        .resp-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .resp-status {
            font-size: 0.74rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 50px;
        }

        .resp-status.ok {
            background: rgba(127, 184, 154, 0.2);
            color: #4F8A6C;
        }

        .resp-status.warn {
            background: rgba(227, 192, 127, 0.25);
            color: #A97A4A;
        }

        .resp-status.err {
            background: rgba(201, 122, 122, 0.2);
            color: #A85F5F;
        }

        .resp-error {
            background: rgba(201, 122, 122, 0.1);
            border: 1px dashed rgba(201, 122, 122, 0.5);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 0.82rem;
            color: #A85F5F;
            line-height: 1.7;
        }

        .resp-headers {
            margin-top: 12px;
            font-size: 0.78rem;
            color: var(--text-light);
        }

        .resp-headers summary {
            cursor: pointer;
            user-select: none;
            padding: 6px 0;
        }

        .resp-headers pre {
            background: #FFFAFB;
            border: 1px solid rgba(230, 200, 210, 0.5);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            overflow-x: auto;
            font-size: 0.74rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* 方法徽标 / 状态 */
        .method-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            flex-shrink: 0;
        }

        .method-GET {
            background: #7FB89A;
        }

        .method-POST {
            background: #8FA8D9;
        }

        .method-PUT {
            background: #D9B27F;
        }

        .method-DELETE {
            background: #D98F8F;
        }

        .method-other {
            background: var(--text-light);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .status-online {
            background: rgba(127, 184, 154, 0.18);
            color: #4F8A6C;
        }

        .status-testing {
            background: rgba(227, 192, 127, 0.22);
            color: #A97A4A;
        }

        .status-offline {
            background: rgba(201, 154, 154, 0.2);
            color: #9A6A6A;
        }

        .status-pill .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        /* 通用内容卡片 */
        .content-card {
            background: var(--white-card);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(240, 215, 225, 0.5);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            box-shadow: var(--shadow-card);
            margin-bottom: 24px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-family: 'Noto Serif SC', serif;
        }

        .card-title i {
            color: var(--sakura-deep);
        }

        /* Markdown 正文 */
        .markdown-body {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.85;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            color: var(--text-primary);
            margin: 18px 0 10px;
            font-size: 1.05rem;
        }

        .markdown-body p {
            margin: 10px 0;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 10px 0 10px 22px;
        }

        .markdown-body blockquote {
            border-left: 3px solid var(--sakura-mid);
            background: rgba(250, 218, 221, 0.25);
            padding: 10px 16px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin: 12px 0;
            color: var(--text-secondary);
        }

        .markdown-body code {
            background: rgba(232, 213, 245, 0.45);
            color: #6B5B7B;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        /* 参数表 */
        .params-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }

        .params-table thead th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.76rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(220, 190, 200, 0.45);
            white-space: nowrap;
        }

        .params-table tbody td {
            padding: 12px;
            border-bottom: 1px solid rgba(240, 225, 232, 0.6);
            color: var(--text-secondary);
            vertical-align: top;
        }

        .params-table tbody tr:last-child td {
            border-bottom: none;
        }

        .params-table tbody tr:hover {
            background: rgba(255, 250, 252, 0.7);
        }

        .param-name {
            font-family: 'Quicksand', monospace;
            font-weight: 700;
            color: var(--text-primary);
        }

        .param-type {
            font-size: 0.72rem;
            background: var(--sky-blue);
            color: #4A6B80;
            padding: 1px 8px;
            border-radius: 50px;
            font-weight: 600;
        }

        .required-badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 50px;
            background: rgba(232, 141, 155, 0.18);
            color: var(--sakura-deep);
        }

        .optional-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 50px;
            background: rgba(168, 157, 168, 0.16);
            color: var(--text-light);
        }

        /* 代码块 */
        .code-wrap {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #FFFAFB;
            border: 1px solid rgba(230, 200, 210, 0.5);
        }

        .code-wrap pre {
            margin: 0;
            padding: 16px 18px;
            overflow-x: auto;
            font-size: 0.8rem;
            line-height: 1.65;
        }

        .code-wrap pre code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: transparent !important;
            padding: 0 !important;
        }

        .code-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(250, 240, 245, 0.85);
            border-bottom: 1px solid rgba(230, 200, 210, 0.45);
        }

        .code-lang {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid rgba(230, 200, 210, 0.7);
            color: var(--text-secondary);
            font-size: 0.74rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background: var(--sakura-pink);
            color: var(--sakura-deep);
            border-color: var(--sakura-mid);
        }

        .copy-btn.copied {
            background: rgba(127, 184, 154, 0.2);
            color: #4F8A6C;
            border-color: rgba(127, 184, 154, 0.5);
        }

        /* 示例切换标签 */
        .example-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .example-tab {
            background: var(--white-card);
            border: 1px solid rgba(230, 200, 210, 0.5);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }

        .example-tab:hover {
            background: rgba(250, 218, 221, 0.35);
            color: var(--sakura-deep);
        }

        .example-tab.active {
            background: var(--sakura-pink);
            color: var(--sakura-deep);
            border-color: var(--sakura-mid);
            font-weight: 700;
        }

        /* 加载 / 错误状态 */
        .state-box {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-light);
        }

        .state-box i {
            font-size: 2.6rem;
            margin-bottom: 14px;
            display: block;
            color: var(--sakura-mid);
        }

        .state-box .state-title {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .state-box .state-desc {
            font-size: 0.85rem;
        }

        .spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 14px;
            border: 3px solid rgba(244, 184, 193, 0.35);
            border-top-color: var(--sakura-deep);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:768px) {
            .api-header-card,
            .content-card {
                padding: 22px 18px;
            }

            .api-title-row h1 {
                font-size: 1.35rem;
            }

            .params-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .param-row {
                grid-template-columns: 24px 1fr 1fr 32px;
                gap: 6px;
            }

            .param-row input[type="text"] {
                padding: 7px 9px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-decoration bg-circle-1"></div>
    <div class="bg-decoration bg-circle-2"></div>
    <div class="bg-decoration bg-circle-3"></div>
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- 顶部导航栏（由 lib/all.js 统一渲染） -->
    <div id="siteNav"></div>

    <main class="container">
        <div class="back-bar" data-aos="fade-up">
            <a href="/apis/" class="back-btn"><i class="fas fa-arrow-left"></i> 返回 API 列表</a>
        </div>

        <div id="detailRoot">
            <div class="state-box">
                <div class="spinner"></div>
                <div class="state-title">正在加载 API 详情...</div>
            </div>
        </div>
    </main>

    <!-- 页脚（由 lib/all.js 统一渲染） -->
    <div id="siteFooter"></div>

    <button class="back-to-top" id="backToTop" title="回到顶部"><i class="fas fa-arrow-up"></i></button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

    <script src="/lib/all.js"></script>
    <script>
        (function () {
            AOS.init({ duration: 700, once: true });

            // ===== 配置文件路径 =====
            const API_DATA_URL = '/apis/apiData.json';

            const STATUS_MAP = {
                online: { text: '可用', cls: 'status-online' },
                testing: { text: '测试中', cls: 'status-testing' },
                offline: { text: '维护中', cls: 'status-offline' }
            };

            const root = document.getElementById('detailRoot');

            // ===== 工具函数 =====
            function escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function methodClass(method) {
                const m = (method || 'GET').toUpperCase();
                return ['GET', 'POST', 'PUT', 'DELETE'].includes(m) ? 'method-' + m : 'method-other';
            }

            function showError(title, desc) {
                root.innerHTML = `
                    <div class="content-card">
                        <div class="state-box">
                            <i class="fas fa-satellite-dish"></i>
                            <div class="state-title">${escapeHtml(title)}</div>
                            <div class="state-desc">${escapeHtml(desc || '')}</div>
                        </div>
                    </div>`;
            }

            // 从 URL 读取 id 参数
            function getIdFromQuery() {
                const params = new URLSearchParams(window.location.search);
                return (params.get('id') || '').trim();
            }

            // ===== 渲染详情 =====
            function renderDetail(api) {
                const st = STATUS_MAP[api.status] || { text: '未知', cls: 'status-offline' };
                const params = api.params || [];
                const examples = api.examples || [];

                // 参数表
                const paramsHtml = params.length ? `
                    <div class="content-card" data-aos="fade-up">
                        <div class="card-title"><i class="fas fa-list-ul"></i> 请求参数</div>
                        <table class="params-table">
                            <thead>
                                <tr>
                                    <th>参数名</th>
                                    <th>类型</th>
                                    <th>必填</th>
                                    <th>说明</th>
                                    <th>示例</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${params.map(p => `
                                    <tr>
                                        <td><span class="param-name">${escapeHtml(p.name)}</span></td>
                                        <td><span class="param-type">${escapeHtml(p.type || 'string')}</span></td>
                                        <td>${p.required
                                            ? '<span class="required-badge">必填</span>'
                                            : '<span class="optional-badge">可选</span>'}</td>
                                        <td>${renderInlineMarkdown(p.desc)}</td>
                                        <td><code>${escapeHtml(p.example || '-')}</code></td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>` : '';

                // 在线请求面板（参数由 JS 动态填充）
                const playgroundHtml = `
                    <div class="content-card" data-aos="fade-up" id="playgroundCard">
                        <div class="card-title"><i class="fas fa-bolt"></i> 在线请求</div>

                        <div class="req-bar">
                            <span class="method-badge ${methodClass(api.method)}">${escapeHtml(api.method || 'GET')}</span>
                            <code id="pgUrlPreview">${escapeHtml(api.endpoint || '')}</code>
                        </div>

                        <div class="req-toolbar">
                            <label class="req-select">
                                <i class="fas fa-right-left"></i>
                                <select id="pgMethod">
                                    ${['GET', 'POST', 'PUT', 'DELETE'].map(m =>
                                        `<option value="${m}"${(api.method || 'GET').toUpperCase() === m ? ' selected' : ''}>${m}</option>`
                                    ).join('')}
                                </select>
                            </label>
                            <button class="mini-btn ghost" id="pgAddParam">
                                <i class="fas fa-plus"></i> 添加参数
                            </button>
                            <button class="mini-btn" id="pgResetParams">
                                <i class="fas fa-rotate-left"></i> 重置为默认
                            </button>
                        </div>

                        <div class="param-editor" id="pgParams"></div>

                        <div class="req-actions">
                            <button class="send-btn" id="pgSend">
                                <i class="fas fa-paper-plane"></i> 发送请求
                            </button>
                            <span class="req-hint">勾选参数可启用/停用，参数值会同步到上方 URL</span>
                        </div>

                        <div class="resp-area" id="pgResponse"></div>
                    </div>`;

                // 响应示例
                const responseHtml = api.response ? `
                    <div class="content-card" data-aos="fade-up">
                        <div class="card-title"><i class="fas fa-reply-all"></i> 响应示例</div>
                        <div class="code-wrap">
                            <div class="code-toolbar">
                                <span class="code-lang">json</span>
                                <button class="copy-btn" data-copy-target="respBlock">
                                    <i class="fas fa-copy"></i> 复制
                                </button>
                            </div>
                            <pre><code id="respBlock" class="language-json">${escapeHtml(api.response)}</code></pre>
                        </div>
                    </div>` : '';

                // 调用示例
                const examplesHtml = examples.length ? `
                    <div class="content-card" data-aos="fade-up">
                        <div class="card-title"><i class="fas fa-code"></i> 调用示例</div>
                        <div class="example-tabs" id="exampleTabs">
                            ${examples.map((ex, i) => `
                                <button class="example-tab${i === 0 ? ' active' : ''}" data-index="${i}">
                                    ${escapeHtml(ex.label || ('示例 ' + (i + 1)))}
                                </button>`).join('')}
                        </div>
                        <div id="exampleBody"></div>
                    </div>` : '';

                root.innerHTML = `
                    <div class="api-header-card" data-aos="fade-up">
                        <div class="api-title-row">
                            <span class="api-icon">${escapeHtml(api.icon || '🔌')}</span>
                            <h1>${escapeHtml(api.name)}</h1>
                            <span class="status-pill ${st.cls}">
                                <span class="status-dot"></span>${st.text}
                            </span>
                        </div>
                        <p class="api-sub">${escapeHtml(api.desc || '')}</p>

                        <div class="endpoint-box">
                            <span class="method-badge ${methodClass(api.method)}">${escapeHtml(api.method || 'GET')}</span>
                            <code id="endpointCode">${escapeHtml(api.endpoint || '')}</code>
                            ${api.endpoint ? `<button class="copy-btn" data-copy-target="endpointCode">
                                <i class="fas fa-copy"></i> 复制</button>` : ''}
                        </div>

                        ${api.intro ? `
                        <div class="intro-merged">
                            <div class="intro-label"><i class="fas fa-circle-info"></i> 接口说明</div>
                            <div class="markdown-body" id="introBody"></div>
                        </div>` : ''}
                    </div>

                    ${paramsHtml}
                    ${playgroundHtml}
                    ${responseHtml}
                    ${examplesHtml}
                `;

                // 渲染 Markdown 说明
                if (api.intro) {
                    const introBody = document.getElementById('introBody');
                    if (introBody) {
                        introBody.innerHTML = (typeof marked !== 'undefined')
                            ? marked.parse(api.intro)
                            : escapeHtml(api.intro).replace(/\n/g, '<br>');
                    }
                }

                // 初始化在线请求面板
                initPlayground(api);

                // 渲染示例代码（默认第一个）
                if (examples.length) renderExample(examples, 0);

                // 高亮
                if (typeof hljs !== 'undefined') {
                    root.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                }

                // 绑定示例标签切换
                const tabs = document.getElementById('exampleTabs');
                if (tabs) {
                    tabs.querySelectorAll('.example-tab').forEach(btn => {
                        btn.addEventListener('click', () => {
                            tabs.querySelectorAll('.example-tab').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            renderExample(examples, parseInt(btn.dataset.index));
                        });
                    });
                }

                // 绑定复制按钮
                bindCopyButtons();
                AOS.refresh();
            }

            // 渲染单个示例代码块
            function renderExample(examples, index) {
                const ex = examples[index];
                const body = document.getElementById('exampleBody');
                if (!ex) { body.innerHTML = ''; return; }
                body.innerHTML = `
                    <div class="code-wrap">
                        <div class="code-toolbar">
                            <span class="code-lang">${escapeHtml(ex.lang || 'text')}</span>
                            <button class="copy-btn" data-copy-target="exampleBlock">
                                <i class="fas fa-copy"></i> 复制
                            </button>
                        </div>
                        <pre><code id="exampleBlock" class="language-${escapeHtml(ex.lang || 'text')}">${escapeHtml(ex.code || '')}</code></pre>
                    </div>`;
                if (typeof hljs !== 'undefined') {
                    const block = document.getElementById('exampleBlock');
                    if (block) hljs.highlightElement(block);
                }
                bindCopyButtons();
            }

            // 复制按钮
            function bindCopyButtons() {
                root.querySelectorAll('.copy-btn[data-copy-target]').forEach(btn => {
                    if (btn.dataset.bound) return;
                    btn.dataset.bound = '1';
                    btn.addEventListener('click', async () => {
                        const target = document.getElementById(btn.dataset.copyTarget);
                        if (!target) return;
                        const text = target.textContent;
                        try {
                            if (navigator.clipboard && window.isSecureContext) {
                                await navigator.clipboard.writeText(text);
                            } else {
                                const ta = document.createElement('textarea');
                                ta.value = text;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                document.execCommand('copy');
                                ta.remove();
                            }
                            const original = btn.innerHTML;
                            btn.classList.add('copied');
                            btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                            setTimeout(() => {
                                btn.classList.remove('copied');
                                btn.innerHTML = original;
                            }, 1600);
                        } catch (e) {
                            btn.innerHTML = '<i class="fas fa-times"></i> 复制失败';
                            setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> 复制'; }, 1600);
                        }
                    });
                });
            }

            // 参数说明里的行内 markdown（`code` 与 **粗体**）
            function renderInlineMarkdown(text) {
                let s = escapeHtml(text || '');
                s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                return s;
            }

            /* ============================================================
               在线请求（Playground）
               ============================================================ */
            let pgState = { api: null, rows: [] };

            // 由配置里的 params 生成默认参数行
            function buildDefaultRows(api) {
                return (api.params || []).map(p => ({
                    name: p.name || '',
                    value: (p.example != null && p.example !== '') ? String(p.example) : '',
                    enabled: true,
                    type: p.type || 'string',
                    lockName: true // 默认参数不允许改名，避免与文档不一致
                }));
            }

            function initPlayground(api) {
                pgState.api = api;
                pgState.rows = buildDefaultRows(api);

                const addBtn = document.getElementById('pgAddParam');
                const resetBtn = document.getElementById('pgResetParams');
                const sendBtn = document.getElementById('pgSend');
                const methodSel = document.getElementById('pgMethod');
                const paramsBox = document.getElementById('pgParams');

                if (addBtn) addBtn.addEventListener('click', () => {
                    pgState.rows.push({ name: '', value: '', enabled: true, type: 'string', lockName: false });
                    renderParamRows();
                });

                if (resetBtn) resetBtn.addEventListener('click', () => {
                    pgState.rows = buildDefaultRows(api);
                    renderParamRows();
                    clearResponse();
                });

                if (sendBtn) sendBtn.addEventListener('click', () => sendRequest());

                if (methodSel) methodSel.addEventListener('change', updateUrlPreview);

                if (paramsBox) {
                    // 事件委托：删除 / 勾选 / 输入
                    paramsBox.addEventListener('click', e => {
                        const delBtn = e.target.closest('.row-del');
                        if (delBtn) {
                            pgState.rows.splice(parseInt(delBtn.dataset.index), 1);
                            renderParamRows();
                        }
                    });
                    paramsBox.addEventListener('input', e => {
                        const row = e.target.closest('.param-row');
                        if (!row) return;
                        const i = parseInt(row.dataset.index);
                        if (e.target.classList.contains('pg-name')) pgState.rows[i].name = e.target.value;
                        if (e.target.classList.contains('pg-value')) pgState.rows[i].value = e.target.value;
                        updateUrlPreview();
                    });
                    paramsBox.addEventListener('change', e => {
                        if (!e.target.classList.contains('pg-enable')) return;
                        const row = e.target.closest('.param-row');
                        const i = parseInt(row.dataset.index);
                        pgState.rows[i].enabled = e.target.checked;
                        row.classList.toggle('disabled', !e.target.checked);
                        updateUrlPreview();
                    });
                }

                renderParamRows();
            }

            function renderParamRows() {
                const box = document.getElementById('pgParams');
                if (!box) return;

                if (pgState.rows.length === 0) {
                    box.innerHTML = '<div class="param-empty">暂无参数，点击「添加参数」新增一个吧~</div>';
                } else {
                    box.innerHTML = pgState.rows.map((r, i) => `
                        <div class="param-row${r.enabled ? '' : ' disabled'}" data-index="${i}">
                            <input type="checkbox" class="pg-enable" ${r.enabled ? 'checked' : ''}
                                   title="启用 / 停用该参数">
                            <input type="text" class="pg-name" placeholder="参数名" value="${escapeHtml(r.name)}"
                                   ${r.lockName ? 'readonly title="来自接口文档的默认参数"' : ''}>
                            <input type="text" class="pg-value" placeholder="参数值" value="${escapeHtml(r.value)}">
                            <button class="row-del" data-index="${i}" title="删除该参数">
                                <i class="fas fa-trash-can"></i>
                            </button>
                        </div>`).join('');
                }
                updateUrlPreview();
            }

            // 收集当前启用的参数（GET/DELETE 走 query，其余走 body）
            function collectParams() {
                const out = [];
                pgState.rows.forEach(r => {
                    if (!r.enabled) return;
                    const name = (r.name || '').trim();
                    if (!name) return;
                    out.push({ name, value: r.value == null ? '' : r.value });
                });
                return out;
            }

            function currentMethod() {
                const sel = document.getElementById('pgMethod');
                return (sel ? sel.value : (pgState.api.method || 'GET')).toUpperCase();
            }

            const BODY_METHODS = ['POST', 'PUT', 'PATCH'];

            // 实时预览请求 URL
            function updateUrlPreview() {
                const preview = document.getElementById('pgUrlPreview');
                if (!preview || !pgState.api) return;
                const base = pgState.api.endpoint || '';
                if (!base) { preview.textContent = '未配置接口地址'; return; }

                let url = base;
                const pairs = [];
                collectParams().forEach(p => {
                    // POST/PUT 等以 JSON body 发送，不出现在 query 里
                    if (BODY_METHODS.includes(currentMethod())) return;
                    pairs.push(encodeURIComponent(p.name) + '=' + encodeURIComponent(p.value));
                });
                if (pairs.length) url += (url.includes('?') ? '&' : '?') + pairs.join('&');
                preview.textContent = url;
            }

            function clearResponse() {
                const box = document.getElementById('pgResponse');
                if (box) box.innerHTML = '';
            }

            // 发送请求
            async function sendRequest() {
                const api = pgState.api;
                const box = document.getElementById('pgResponse');
                const sendBtn = document.getElementById('pgSend');
                if (!api || !box) return;

                const base = (api.endpoint || '').trim();
                if (!base) {
                    box.innerHTML = '<div class="resp-error"><i class="fas fa-circle-exclamation"></i> 该 API 尚未配置接口地址。</div>';
                    return;
                }

                const method = currentMethod();
                const params = collectParams();
                let url = base;
                const headers = {};
                let body;

                if (BODY_METHODS.includes(method)) {
                    headers['Content-Type'] = 'application/json';
                    const obj = {};
                    params.forEach(p => { obj[p.name] = p.value; });
                    body = JSON.stringify(obj);
                } else {
                    const pairs = params.map(p =>
                        encodeURIComponent(p.name) + '=' + encodeURIComponent(p.value));
                    if (pairs.length) url += (url.includes('?') ? '&' : '?') + pairs.join('&');
                }

                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 请求中...';
                box.innerHTML = `
                    <div class="resp-meta">
                        <span class="resp-status warn">请求中</span>
                        <span>${escapeHtml(method)} ${escapeHtml(url)}</span>
                    </div>`;

                const started = performance.now();
                try {
                    const res = await fetch(url, {
                        method,
                        headers,
                        body
                    });
                    const elapsed = Math.round(performance.now() - started);
                    const text = await res.text();

                    let pretty = text;
                    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* 非 JSON 原样显示 */ }

                    const ok = res.ok;
                    const statusCls = ok ? 'ok' : (res.status >= 500 ? 'err' : 'warn');

                    const headerLines = [];
                    res.headers.forEach((v, k) => headerLines.push(k + ': ' + v));

                    box.innerHTML = `
                        <div class="resp-meta">
                            <span class="resp-status ${statusCls}">${res.status} ${escapeHtml(res.statusText || '')}</span>
                            <span><i class="fas fa-stopwatch"></i> ${elapsed} ms</span>
                            <span><i class="fas fa-file-lines"></i> ${escapeHtml(res.headers.get('content-type') || '未知类型')}</span>
                        </div>
                        <div class="code-wrap">
                            <div class="code-toolbar">
                                <span class="code-lang">response</span>
                                <button class="copy-btn" data-copy-target="pgRespBlock">
                                    <i class="fas fa-copy"></i> 复制
                                </button>
                            </div>
                            <pre><code id="pgRespBlock" class="language-json">${escapeHtml(pretty)}</code></pre>
                        </div>
                        ${headerLines.length ? `
                        <details class="resp-headers">
                            <summary><i class="fas fa-chevron-right"></i> 响应头（${headerLines.length}）</summary>
                            <pre>${escapeHtml(headerLines.join('\n'))}</pre>
                        </details>` : ''}`;

                    if (typeof hljs !== 'undefined') {
                        const blk = document.getElementById('pgRespBlock');
                        if (blk) hljs.highlightElement(blk);
                    }
                    bindCopyButtons();
                } catch (err) {
                    const elapsed = Math.round(performance.now() - started);
                    box.innerHTML = `
                        <div class="resp-meta">
                            <span class="resp-status err">请求失败</span>
                            <span><i class="fas fa-stopwatch"></i> ${elapsed} ms</span>
                        </div>
                        <div class="resp-error">
                            <i class="fas fa-triangle-exclamation"></i>
                            <strong>${escapeHtml(err && err.message ? err.message : '未知错误')}</strong><br>
                            可能是跨域（CORS）限制、网络不可达，或接口地址尚未配置。<br>
                            <span style="font-size:0.76rem;">提示：浏览器直接请求需目标接口允许跨域，可考虑通过本站代理转发。</span>
                        </div>`;
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送请求';
                }
            }

            // ===== 启动 =====
            async function init() {
                const id = getIdFromQuery();
                if (!id) {
                    showError('缺少 API 标识', '请在链接中提供 id 参数，例如 /api/detail.html?id=001');
                    return;
                }

                try {
                    const response = await fetch(API_DATA_URL);
                    if (!response.ok) throw new Error('配置加载失败');
                    const json = await response.json();
                    const list = Array.isArray(json) ? json : (json.apis || []);
                    const api = list.find(item => String(item.id) === id);

                    if (!api) {
                        showError('未找到该 API', `没有找到 id 为「${id}」的接口，请返回列表重新选择~`);
                        document.title = '冰凌の小栈 | 未找到 API';
                        return;
                    }

                    document.title = `冰凌の小栈 | ${api.name}`;
                    renderDetail(api);
                } catch (error) {
                    showError('数据加载失败', '请检查 ' + API_DATA_URL + ' 是否存在且格式正确。');
                }
            }

            init();
        })();
    </script>
</body>

</html>
